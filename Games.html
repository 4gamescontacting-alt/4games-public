<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>

<script>
window.onload = function() {
  const container = document.querySelector('.game-container');
  const cards = Array.from(container.querySelectorAll('a.card'));
  const shownEl = document.getElementById('shownCount');
  const totalEl = document.getElementById('totalCount');
  const input = document.getElementById('searchInput');

  const TOTAL = cards.length;
  totalEl.textContent = TOTAL;

  
  function animate(el, from, to, duration = 300) {
    const start = performance.now();

    function update(now) {
      const progress = Math.min((now - start) / duration, 1);
      el.textContent = Math.floor(from + (to - from) * progress);
      if (progress < 1) requestAnimationFrame(update);
    }
    requestAnimationFrame(update);
  }

  
  cards.sort((a, b) => {
    const A = a.querySelector('.game-title').textContent.toLowerCase();
    const B = b.querySelector('.game-title').textContent.toLowerCase();
    return A.localeCompare(B);
  });

  container.innerHTML = '';
  cards.forEach(card => container.appendChild(card));

  
  animate(shownEl, 0, TOTAL);

  let currentShown = TOTAL;

  
  input.addEventListener('input', function() {
    const filter = input.value.toLowerCase();
    let visible = 0;

    cards.forEach(card => {
      const name = card.querySelector('.game-title').textContent.toLowerCase();
      if (name.includes(filter)) {
        card.style.display = '';
        visible++;
      } else {
        card.style.display = 'none';
      }
    });

    animate(shownEl, currentShown, visible);
    currentShown = visible;
  });
};
</script>

<div id="fg-viewer">

    <span id="fg-title">game title (if you see this title broke)</span>

      <button class="fg-btn" onclick="fgReload()">Reload Game</button>
      <button class="fg-btn" onclick="fgOpenProxied()">Open in New Tab</button>
      <button class="fg-btn fg-btn-close" onclick="fgClose()">Close</button>
    </div>
  </div>

<script>
(function () {
  let currentProxied = '';
  let currentDirect  = '';

  window.fgOpen = function(proxiedUrl, directUrl, title) {
    currentProxied = proxiedUrl;
    currentDirect  = directUrl;
    document.getElementById('fg-title').textContent = title || 'Game';
    document.getElementById('fg-iframe').src = proxiedUrl;
    document.getElementById('fg-viewer').classList.add('open');
    document.body.style.overflow = 'hidden';
  };

  window.fgClose = function() {
    document.getElementById('fg-viewer').classList.remove('open');
    document.getElementById('fg-iframe').src = 'about:blank';
    document.body.style.overflow = '';
  };

  window.fgReload = function() {
    document.getElementById('fg-iframe').src = currentProxied;
  };

  window.fgOpenProxied = function() {
    if (currentProxied) window.open(currentProxied, '_blank');
  };

  window.fgOpenDirect = function() {
    if (currentDirect) window.open(currentDirect, '_blank');
  };

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && document.getElementById('fg-viewer').classList.contains('open')) fgClose();
  });

  document.addEventListener('click', function(e) {
    const link = e.target.closest('a[href]');
    if (!link) return;
    const href = link.getAttribute('href');
    if (!href || href.startsWith('#') || href.startsWith('javascript:')) return;

    if (href.startsWith('http')) {
      e.preventDefault();

      let title = 'Game';
      const card = link.closest('.card');
      if (card) {
        const gt = card.querySelector('.game-title');
        if (gt) title = gt.textContent.trim();
      }

      fgOpen(href, href, title);
      return;
    }

    
    if (href.startsWith('/games/')) {
      e.preventDefault();

      let title = 'Game';
      const card = link.closest('.card');
      if (card) {
        const gt = card.querySelector('.game-title');
        if (gt) title = gt.textContent.trim();
      }

      fgOpen(href, href, title);
    }
  });
})();
</script>

<script>
(function() {
  var container = document.querySelector('.game-container');
  var shownEl = document.getElementById('shownCount');
  var totalEl = document.getElementById('totalCount');
  var input = document.getElementById('searchInput');
  var allCards = [];
  var currentShown = 0;

  fetch('https://cdn.jsdelivr.net/gh/4gamescontacting-alt/4games-public@main/games.json')
    .then(function(r) { return r.json(); })
    .then(function(games) {
      games.sort(function(a, b) { return a.title.localeCompare(b.title); });

      games.forEach(function(game) {
        var a = document.createElement('a');
        a.href = game.url;
        a.className = 'card';
        a.style = '';
        a.innerHTML = '<span class="game-title">' + game.title + '</span>';
        container.appendChild(a);
        allCards.push(a);
      });

      var total = allCards.length;
      totalEl.textContent = total;
      shownEl.textContent = total;
      currentShown = total;

      input.addEventListener('input', function() {
        var filter = input.value.toLowerCase();
        var visible = 0;
        allCards.forEach(function(card) {
          var name = card.querySelector('.game-title').textContent.toLowerCase();
          if (name.includes(filter)) { card.style.display = ''; visible++; }
          else { card.style.display = 'none'; }
        });
        shownEl.textContent = visible;
        currentShown = visible;
      });
    })
    .catch(function(err) {
      console.error('Failed to load game list:', err);
      container.innerHTML = '<p style="color:#ff416c;text-align:center;grid-column:1/-1;">Could not load games. Is the server running?</p>';
    });
})();
</script>
